services:
  - type: web
    name: social-publisher
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.4
      - key: APP_API_KEY
        generateValue: true
      - key: FACEBOOK_PAGE_ID
        sync: false
      - key: LINKEDIN_PERSON_ID
        sync: false
      - key: X_CLIENT_ID
        sync: false
      - key: X_CLIENT_SECRET
        sync: false
      - key: X_OAUTH1_CONSUMER_KEY
        sync: false
      - key: X_OAUTH1_CONSUMER_SECRET
        sync: false
      - key: X_OAUTH1_ACCESS_TOKEN
        sync: false
      - key: X_OAUTH1_ACCESS_TOKEN_SECRET
        sync: false
